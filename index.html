<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENFOQUE</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent-green: #00ff66;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .header-title-container .sistema-activo {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--accent-green);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .header-title-container h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .user-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
            font-weight: 700;
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .card-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .weight-input-group {
            display: flex;
            gap: 10px;
        }

        .weight-input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .weight-input::placeholder {
            color: var(--text-muted);
        }

        .weight-input:focus {
            border-color: var(--accent-green);
        }

        .btn-register {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-register:active {
            opacity: 0.8;
        }

        .water-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .water-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 0;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .water-btn.active {
            background-color: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }

        .tip-text {
            font-size: 14px;
            line-height: 1.5;
            color: #c9d1d9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-title-container">
                <div class="sistema-activo">SISTEMA ACTIVO</div>
                <h1>ENFOQUE</h1>
            </div>
            <div class="user-badge">AF</div>
        </header>

        <!-- Peso Actual -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Peso Actual</span>
                <span class="card-value">78.5 Kg</span>
            </div>
            <div class="weight-input-group">
                <input type="number" step="0.1" class="weight-input" placeholder="Nuevo peso (kg)">
                <button class="btn-register">Registrar</button>
            </div>
        </div>

        <!-- Hidratación Diaria -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Hidratación Diaria</span>
                <span class="card-value" style="font-size: 16px;">0.0 / 3.0 L</span>
            </div>
            <div class="water-grid">
                <button class="water-btn">0.5L</button>
                <button class="water-btn">1.0L</button>
                <button class="water-btn">1.5L</button>
                <button class="water-btn">2.0L</button>
                <button class="water-btn">2.5L</button>
                <button class="water-btn">3.0L</button>
            </div>
        </div>

        <!-- Consejo del Día -->
        <div class="card">
            <div class="card-header" style="margin-bottom: 10px;">
                <span class="card-title">Consejo del Día</span>
            </div>
            <p class="tip-text">
                La consistencia supera a la intensidad ocasional. Mantén tus macros limpios y ejecuta cada serie con rango completo.
            </p>
        </div>
    </div>

</body>
</html>
