<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker - Control de Progreso</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-surface: #1e1e1e;
            --bg-card: #2a2a2a;
            --accent: #00e676;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --danger: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        header {
            background-color: var(--bg-surface);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        main {
            padding: 16px;
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--bg-surface);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        .image-preview {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            border: 1px solid var(--border-color);
        }

        /* Nav Inferior */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-surface);
            display: flex;
            border-top: 1px solid var(--border-color);
            height: 60px;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.75rem;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
            fill: currentColor;
        }

        /* Lista de Registros e Histórico */
        .history-item {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent);
        }

        .history-item .header-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .history-item .title-info {
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .history-item .detail-info {
            font-size: 0.95rem;
            color: var(--accent);
            margin-top: 4px;
        }

        .history-item img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 8px;
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger);
            border: none;
            font-size: 0.8rem;
            padding: 4px;
            width: auto;
            cursor: pointer;
            float: right;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gym Tracker</h1>
    </header>

    <main>
        <!-- TAB 1: REGISTRAR -->
        <section id="tab-register" class="tab-content active">
            <div class="card">
                <form id="workout-form">
                    <div class="form-group">
                        <label for="workout-date">Fecha</label>
                        <input type="date" id="workout-date" required>
                    </div>

                    <div class="form-group">
                        <label for="exercise-select">Ejercicio</label>
                        <select id="exercise-select" required>
                            <!-- Opciones cargadas por JS -->
                        </select>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label for="weight-input">Peso (kg)</label>
                            <input type="number" id="weight-input" step="0.5" placeholder="ej. 80" required>
                        </div>
                        <div class="form-group">
                            <label for="reps-input">Repeticiones</label>
                            <input type="number" id="reps-input" placeholder="ej. 10" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="sets-input">Series completadas</label>
                        <input type="number" id="sets-input" placeholder="ej. 4" value="4" required>
                    </div>

                    <div class="form-group">
                        <label for="photo-input">Foto de progreso (Galería)</label>
                        <input type="file" id="photo-input" accept="image/*">
                        <img id="photo-preview" class="image-preview" alt="Vista previa">
                    </div>

                    <button type="submit" class="btn-primary">Guardar Entrenamiento</button>
                </form>
            </div>
        </section>

        <!-- TAB 2: CONSULTAR PROGRESO POR EJERCICIO -->
        <section id="tab-progress" class="tab-content">
            <div class="card">
                <div class="form-group">
                    <label for="filter-exercise">Filtrar por Ejercicio</label>
                    <select id="filter-exercise">
                        <option value="">-- Selecciona un ejercicio --</option>
                    </select>
                </div>
            </div>
            <div id="progress-results">
                <div class="empty-state">Selecciona un ejercicio para ver tu sobrecarga progresiva.</div>
            </div>
        </section>

        <!-- TAB 3: GALERÍA Y DIARIO GLOBAL -->
        <section id="tab-history" class="tab-content">
            <div id="global-history-list">
                <!-- Carga dinámica -->
            </div>
        </section>
    </main>

    <nav>
        <button class="nav-item active" onclick="switchTab('tab-register', this)">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Registrar
        </button>
        <button class="nav-item" onclick="switchTab('tab-progress', this)">
            <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
            Progreso
        </button>
        <button class="nav-item" onclick="switchTab('tab-history', this)">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
            Histórico
        </button>
    </nav>

    <script>
        // --- BASE DE DATOS LOCAL (IndexedDB) ---
        const DB_NAME = 'GymTrackerDB';
        const DB_VERSION = 1;
        let db;

        const defaultExercises = [
            "Prensa 45°",
            "Sentadilla Libre",
            "Peso Muerto",
            "Extensión de Cuádriceps",
            "Curl Femoral",
            "Press de Banca Plano",
            "Press Inclinado con Mancuernas",
            "Jalón al Pecho",
            "Remo con Barra",
            "Press Militar",
            "Elevaciones Laterales"
        ];

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject("Error abriendo DB", e);
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const dbRef = e.target.result;
                    if (!dbRef.objectStoreNames.contains('logs')) {
                        const store = dbRef.createObjectStore('logs', { keyPath: 'id', autoIncrement: true });
                        store.createIndex('exercise', 'exercise', { unique: false });
                        store.createIndex('date', 'date', { unique: false });
                    }
                };
            });
        }

        function saveLog(logData) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(['logs'], 'readwrite');
                const store = tx.objectStore('logs');
                const req = store.add(logData);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function getAllLogs() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(['logs'], 'readonly');
                const store = tx.objectStore('logs');
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function deleteLog(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(['logs'], 'readwrite');
                const store = tx.objectStore('logs');
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // --- INTERFAZ Y NAVEGACIÓN ---
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');

            if (tabId === 'tab-progress') loadProgressFilter();
            if (tabId === 'tab-history') loadGlobalHistory();
        }

        function populateSelects() {
            const exerciseSelect = document.getElementById('exercise-select');
            const filterSelect = document.getElementById('filter-exercise');
            
            exerciseSelect.innerHTML = '';
            filterSelect.innerHTML = '<option value="">-- Selecciona un ejercicio --</option>';

            defaultExercises.sort().forEach(ex => {
                const opt1 = document.createElement('option');
                opt1.value = ex;
                opt1.textContent = ex;
                exerciseSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = ex;
                opt2.textContent = ex;
                filterSelect.appendChild(opt2);
            });
        }

        // Manejo de vista previa de imagen
        let currentPhotoBase64 = null;
        document.getElementById('photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentPhotoBase64 = event.target.result;
                    const preview = document.getElementById('photo-preview');
                    preview.src = currentPhotoBase64;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Envío del formulario
        document.getElementById('workout-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const logData = {
                date: document.getElementById('workout-date').value,
                exercise: document.getElementById('exercise-select').value,
                weight: parseFloat(document.getElementById('weight-input').value),
                reps: parseInt(document.getElementById('reps-input').value),
                sets: parseInt(document.getElementById('sets-input').value),
                photo: currentPhotoBase64,
                timestamp: new Date().getTime()
            };

            await saveLog(logData);
            alert("¡Entrenamiento guardado con éxito!");

            // Limpiar formulario parcial
            document.getElementById('weight-input').value = '';
            document.getElementById('reps-input').value = '';
            document.getElementById('photo-input').value = '';
            document.getElementById('photo-preview').style.display = 'none';
            currentPhotoBase64 = null;
        });

        // Filtrado por ejercicio
        document.getElementById('filter-exercise').addEventListener('change', async function(e) {
            const selectedEx = e.target.value;
            const container = document.getElementById('progress-results');
            if (!selectedEx) {
                container.innerHTML = '<div class="empty-state">Selecciona un ejercicio para ver tu sobrecarga progresiva.</div>';
                return;
            }

            const allLogs = await getAllLogs();
            const filtered = allLogs
                .filter(l => l.exercise === selectedEx)
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">No hay registros para "${selectedEx}".</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="history-item">
                    <div class="header-info">
                        <span>${item.date}</span>
                        <span>${item.sets} series</span>
                    </div>
                    <div class="title-info">${item.exercise}</div>
                    <div class="detail-info">${item.weight} kg × ${item.reps} reps</div>
                    ${item.photo ? `<img src="${item.photo}" alt="Foto de progreso">` : ''}
                </div>
            `).join('');
        });

        // Carga de historial global
        async function loadGlobalHistory() {
            const container = document.getElementById('global-history-list');
            const allLogs = await getAllLogs();
            
            if (allLogs.length === 0) {
                container.innerHTML = '<div class="empty-state">Aún no tienes entrenamientos guardados.</div>';
                return;
            }

            allLogs.sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = allLogs.map(item => `
                <div class="history-item">
                    <button class="delete-btn" onclick="removeLog(${item.id})">Eliminar</button>
                    <div class="header-info">
                        <span>${item.date}</span>
                        <span>${item.sets} series</span>
                    </div>
                    <div class="title-info">${item.exercise}</div>
                    <div class="detail-info">${item.weight} kg × ${item.reps} reps</div>
                    ${item.photo ? `<img src="${item.photo}" alt="Foto de progreso">` : ''}
                </div>
            `).join('');
        }

        async function removeLog(id) {
            if (confirm("¿Deseas eliminar este registro?")) {
                await deleteLog(id);
                loadGlobalHistory();
            }
        }

        function loadProgressFilter() {
            document.getElementById('filter-exercise').dispatchEvent(new Event('change'));
        }

        // Inicialización
        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('workout-date').valueAsDate = new Date();
            populateSelects();
            await initDB();
        });
    </script>
</body>
</html>
