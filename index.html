<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ENFOQUE - Fitness App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0c0e">
  
  <style>
    :root {
      --bg-main: #0b0c0e;
      --card-bg: #15181c;
      --card-inner: #1c2026;
      --accent-neon: #00e676;
      --accent-glow: rgba(0, 230, 118, 0.4);
      --text-main: #ffffff;
      --text-muted: #8e95a0;
      --fire: #ff6d00;
      --radius-lg: 22px;
      --radius-md: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 95px; -webkit-tap-highlight-color: transparent; }

    /* Top Bar & Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 10px;
    }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .brand-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #000;
      border: 2px solid var(--accent-neon);
      object-fit: cover;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .brand-title { font-size: 1rem; font-weight: 800; letter-spacing: 0.5px; }
    .brand-sub { font-size: 0.75rem; color: var(--text-muted); }

    /* Main Hero Widget (Banner) */
    .hero-widget {
      background: linear-gradient(135deg, #18261e 0%, #15181c 100%);
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin: 10px 20px 20px;
      position: relative;
      overflow: hidden;
    }
    .hero-widget::after {
      content: '';
      position: absolute;
      top: -30%; right: -20%;
      width: 140px; height: 140px;
      background: var(--accent-neon);
      opacity: 0.12;
      filter: blur(40px);
      border-radius: 50%;
    }
    .hero-tag {
      display: inline-block;
      background: var(--accent-neon);
      color: #000;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .hero-verse { font-size: 1.05rem; font-weight: 700; line-height: 1.35; margin-bottom: 6px; }
    .hero-ref { font-size: 0.8rem; color: var(--accent-neon); font-weight: 700; }

    /* Layout Content */
    .container { padding: 0 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Horizontal Day Selector (Pills) */
    .day-selector-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
      scrollbar-width: none;
    }
    .day-selector-scroll::-webkit-scrollbar { display: none; }
    .day-pill {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.05);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .day-pill.active {
      background: var(--accent-neon);
      color: #000;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Exercise Cards Dribbble Style */
    .card-item {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 14px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-size: 0.98rem; font-weight: 700; }
    .card-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    
    .input-box {
      background: var(--card-inner);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .input-box label { font-size: 0.78rem; color: var(--accent-neon); font-weight: 700; }
    .input-box input {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      text-align: right;
      width: 90px;
      outline: none;
    }

    .fire-badge {
      display: none;
      background: rgba(255, 109, 0, 0.15);
      border: 1px solid var(--fire);
      color: var(--fire);
      font-weight: 800;
      font-size: 0.78rem;
      text-align: center;
      padding: 8px;
      border-radius: var(--radius-md);
      margin-top: 10px;
    }

    /* Nutrition Health Grade Widget */
    .health-grade-widget {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 15px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .grade-circle {
      width: 65px; height: 65px;
      border-radius: 50%;
      background: conic-gradient(var(--accent-neon) 90%, #222 0);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .grade-circle::before {
      content: ''; position: absolute;
      width: 50px; height: 50px;
      background: var(--card-bg);
      border-radius: 50%;
    }
    .grade-text { position: relative; font-weight: 900; font-size: 0.95rem; color: #fff; }

    .nutrition-toggle {
      display: flex;
      background: var(--card-inner);
      padding: 4px;
      border-radius: 30px;
      margin-bottom: 15px;
    }
    .nut-btn {
      flex: 1; padding: 10px; border: none; background: none;
      color: var(--text-muted); font-size: 0.78rem; font-weight: 800;
      border-radius: 25px; cursor: pointer;
    }
    .nut-btn.active { background: var(--accent-neon); color: #000; }

    /* Bottom Dock Floating Navigation */
    .bottom-dock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 420px;
      background: rgba(21, 24, 28, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 35px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 999;
    }
    .dock-btn {
      background: none; border: none;
      color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 0.68rem; font-weight: 700;
      padding: 8px 16px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dock-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .dock-btn.active {
      background: var(--accent-neon);
      color: #000;
      box-shadow: 0 0 10px var(--accent-glow);
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="user-profile">
      <img src="logo.png" alt="Logo" class="brand-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%2300e676\'><path d=\'M13 2L3 14h9l-1 8 10-12h-9l1-8z\'/></svg>'">
      <div>
        <div class="brand-title">ENFOQUE</div>
        <div class="brand-sub">Versión v20 • Premium</div>
      </div>
    </div>
  </div>

  <!-- HERO BANNER -->
  <div class="hero-widget">
    <span class="hero-tag">Mente & Fuerza</span>
    <div class="hero-verse">"Todo lo puedo en Cristo que me fortalece"</div>
    <div class="hero-ref">FILIPENSES 4:13</div>
  </div>

  <div class="container">
    
    <!-- PESTAÑA: RUTINA -->
    <div id="tab-rutina" class="tab-content active">
      <div class="day-selector-scroll">
        <button class="day-pill active" onclick="selectDay('lunes', this)">Lunes</button>
        <button class="day-pill" onclick="selectDay('martes', this)">Martes</button>
        <button class="day-pill" onclick="selectDay('miercoles', this)">Miércoles</button>
        <button class="day-pill" onclick="selectDay('jueves', this)">Jueves</button>
        <button class="day-pill" onclick="selectDay('viernes', this)">Viernes</button>
        <button class="day-pill" onclick="selectDay('sabado', this)">Sábado</button>
      </div>

      <div id="exerciseList"></div>
    </div>

    <!-- PESTAÑA: NUTRICIÓN -->
    <div id="tab-nutricion" class="tab-content">
      <div class="health-grade-widget">
        <div class="grade-circle">
          <span class="grade-text">95%</span>
        </div>
        <div>
          <div style="font-weight: 800; font-size: 0.95rem;">Meta Nutricional</div>
          <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;" id="nutSubText">Cumpliendo requerimientos diarios</div>
        </div>
      </div>

      <div class="nutrition-toggle">
        <button id="btn-g-hip" class="nut-btn active" onclick="setNutGoal('hipertrofia')">💪 GANAR MASA</button>
        <button id="btn-g-def" class="nut-btn" onclick="setNutGoal('definicion')">🔥 BAJAR GRASA</button>
      </div>

      <div id="mealsList"></div>
    </div>

  </div>

  <!-- BOTTOM FLOATING DOCK -->
  <div class="bottom-dock">
    <button class="dock-btn active" onclick="switchDock('rutina', this)">
      <svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 6.29 3.43 4.86 2 3.43 3.43 2 4.86 3.43 6.29 2 7.71 3.43 9.14 2 10.57 3.43 12 7 3.43 15.57 2 17 3.43 18.43 2 19.86 3.43 21.29 4.86 19.86 6.29 21.29 7.71 19.86 9.14 21.29 10.57 19.86 12 17 20.57 14.86z"/></svg>
      Rutina
    </button>
    <button class="dock-btn" onclick="switchDock('nutricion', this)">
      <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.38L6.08 22pxh2.83l-.37-8.62C10.54 12.9 12 11.12 12 9V2h-1v7zm7-7s-3 0-3 5v6h2v9h2V2h-1z"/></svg>
      Nutrición
    </button>
  </div>

  <script>
    const routines = {
      lunes: [
        { name: "Press de Banca Inclinado con Barra", prev: 60 },
        { name: "Press Plano con Mancuernas", prev: 24 },
        { name: "Aperturas en Polea (Cruce de Cables)", prev: 15 },
        { name: "Press Militar con Mancuernas", prev: 18 },
        { name: "Extensión de Tríceps en Polea", prev: 25 }
      ],
      martes: [
        { name: "Jalón al Pecho (Polea Alta)", prev: 55 },
        { name: "Remo con Barra", prev: 50 },
        { name: "Remo Unilateral con Mancuerna", prev: 22 },
        { name: "Curl de Bíceps con Barra Z", prev: 30 }
      ],
      miercoles: [
        { name: "Sentadilla Libre con Barra", prev: 80 },
        { name: "Prensa 45°", prev: 140 },
        { name: "Extensión de Cuádriceps", prev: 45 },
        { name: "Curl Femoral Tumbado", prev: 35 }
      ],
      jueves: [
        { name: "Press de Banca Plano", prev: 65 },
        { name: "Elevaciones Laterales Hombro", prev: 10 },
        { name: "Press Francés Tríceps", prev: 20 }
      ],
      viernes: [
        { name: "Dominadas Agarre Estrecho", prev: 50 },
        { name: "Remo en Gironda", prev: 45 },
        { name: "Curl de Bíceps Banco Scott", prev: 25 }
      ],
      sabado: [
        { name: "Peso Muerto Rumano", prev: 70 },
        { name: "Hip Thrust Glúteo", prev: 90 },
        { name: "Zancadas / Búlgaras", prev: 16 }
      ]
    };

    const nutritionData = {
      hipertrofia: [
        { type: "Desayuno", name: "Omelette 4 Huevos + Avena & Banano", macro: "580 kcal | 36g Proteína" },
        { type: "Almuerzo", name: "220g Pechuga + 1.5 Tazas Arroz + Ensalada", macro: "700 kcal | 50g Proteína" },
        { type: "Cena", name: "200g Carne Magra + Yuca al Vapor", macro: "620 kcal | 44g Proteína" }
      ],
      definicion: [
        { type: "Desayuno", name: "4 Claras + 1 Huevo + Espinaca + 1 Tostada", macro: "320 kcal | 28g Proteína" },
        { type: "Almuerzo", name: "200g Pechuga + Ensalada Grande + 1/2 Taza Arroz", macro: "480 kcal | 46g Proteína" },
        { type: "Cena", name: "200g Filete Pescado + Ensalada Verde", macro: "380 kcal | 40g Proteína" }
      ]
    };

    let currentDay = 'lunes';
    let currentNutGoal = 'hipertrofia';

    function selectDay(day, btn) {
      currentDay = day;
      document.querySelectorAll('.day-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderRoutine();
    }

    function renderRoutine() {
      const list = routines[currentDay] || [];
      const container = document.getElementById('exerciseList');
      container.innerHTML = '';

      list.forEach((ex, idx) => {
        const item = document.createElement('div');
        item.className = 'card-item';
        item.innerHTML = `
          <div class="card-header">
            <div>
              <div class="card-title">${ex.name}</div>
              <div class="card-sub">Última marca: ${ex.prev} kg</div>
            </div>
          </div>
          <div class="input-box">
            <label>PESO DE HOY</label>
            <input type="number" placeholder="${ex.prev}" oninput="evaluateWeight(this, ${ex.prev}, ${idx})">
          </div>
          <div id="fire-${idx}" class="fire-badge">🔥 ¡AUMENTASTE FUERZA! SUPERASTE TU MARCA</div>
        `;
        container.appendChild(item);
      });
    }

    function evaluateWeight(input, prevVal, idx) {
      const val = parseFloat(input.value);
      const badge = document.getElementById(`fire-${idx}`);
      if (!isNaN(val) && val > prevVal) {
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    function switchDock(tab, btn) {
      document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
      if (tab === 'nutricion') renderNutrition();
    }

    function setNutGoal(goal) {
      currentNutGoal = goal;
      document.getElementById('btn-g-hip').classList.toggle('active', goal === 'hipertrofia');
      document.getElementById('btn-g-def').classList.toggle('active', goal === 'definicion');
      renderNutrition();
    }

    function renderNutrition() {
      const list = nutritionData[currentNutGoal];
      const container = document.getElementById('mealsList');
      container.innerHTML = '';

      list.forEach(m => {
        const item = document.createElement('div');
        item.className = 'card-item';
        item.innerHTML = `
          <div style="font-size: 0.75rem; color: var(--accent-neon); font-weight: 800; text-transform: uppercase;">${m.type}</div>
          <div class="card-title" style="margin: 4px 0;">${m.name}</div>
          <div class="card-sub" style="color: #fff; font-weight: 700;">${m.macro}</div>
        `;
        container.appendChild(item);
      });
    }

    window.onload = () => {
      renderRoutine();
    };
  </script>
</body>
</html>
