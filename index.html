<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENFOQUE — Performance Club</title>
    
    <!-- Tailwind CSS CDN para estilos profesionales -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#080A08',
                            card: '#121512',
                            neon: '#CCFF00',
                            muted: '#8E958D'
                        }
                    }
                }
            }
        }
    </script>

    <!-- React 18 & Babel para componentes limpios -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-brand-black text-white font-sans antialiased min-h-screen">

    <div id="root"></div>

    <!-- CÓDIGO REACT RESTRUCTURADO -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // 1. COMPONENTE PORTADA (LANDING)
        function LandingScreen({ onEnter }) {
            return (
                <div class="min-h-screen flex flex-col items-center justify-between p-8 bg-cover bg-center text-center relative" style={{ backgroundImage: "linear-gradient(180deg, rgba(8,10,8,0.7) 0%, #080A08 100%), url('portada.jpg')" }}>
                    <div class="text-brand-neon font-bold text-xs tracking-widest mt-6">1 CORINTIOS 9:27</div>
                    
                    <div class="flex flex-col items-center gap-4 my-auto">
                        <h1 class="text-4xl font-black tracking-widest text-white">DISCIPLINA</h1>
                        <img src="ENFOQUE.jpg" alt="Logo ENFOQUE" class="w-28 h-auto object-contain my-2 drop-shadow-[0_0_20px_rgba(204,255,0,0.3)]" />
                        
                        <button 
                            onClick={onEnter} 
                            class="bg-brand-neon text-black font-extrabold px-8 py-4 rounded-full text-sm tracking-wider uppercase shadow-[0_0_25px_rgba(204,255,0,0.4)] hover:scale-105 active:scale-95 transition-all mt-4"
                        >
                            ENTRAR AL DASHBOARD ➔
                        </button>
                    </div>

                    <div class="text-brand-neon font-bold text-xs tracking-widest mb-6">JOSUÉ 1:9</div>
                </div>
            );
        }

        // 2. COMPONENTE DASHBOARD (PANEL PRINCIPAL)
        function DashboardScreen() {
            return (
                <div class="min-h-screen pb-24 max-w-4xl mx-auto p-6 space-y-6">
                    {/* Header */}
                    <div class="flex justify-between items-center pt-4">
                        <div>
                            <span class="text-xs text-brand-muted font-bold tracking-wider">ENFOQUE PERFORMANCE</span>
                            <h2 class="text-xl font-extrabold">¡Hola, Andrés Felipe! 🔥</h2>
                        </div>
                        <div class="w-11 h-11 rounded-full bg-brand-neon text-black font-black flex items-center justify-center text-lg shadow-[0_0_15px_rgba(204,255,0,0.3)]">
                            A
                        </div>
                    </div>

                    {/* Tarjeta Hero */}
                    <div class="bg-gradient-to-br from-[#161B14] to-[#0C0F0B] border border-brand-neon/30 p-6 rounded-3xl space-y-3">
                        <span class="text-brand-neon text-xs font-bold tracking-widest">ENTRENAMIENTO DE HOY</span>
                        <h3 class="text-2xl font-black">PECHO + TRÍCEPS</h3>
                        <p class="text-brand-muted text-sm">5 Ejercicios estructurados • 55 Minutos</p>
                        <button class="bg-brand-neon text-black font-extrabold px-6 py-3 rounded-full text-xs tracking-wider uppercase shadow-[0_0_15px_rgba(204,255,0,0.3)] hover:opacity-90 active:scale-95 transition-all">
                            COMENZAR SESIÓN ➔
                        </button>
                    </div>

                    {/* Métricas en Grid */}
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-brand-card border border-white/10 p-4 rounded-2xl">
                            <span class="text-xs text-brand-muted font-semibold">Calorías Activas</span>
                            <div class="text-2xl font-black mt-1">420 <span class="text-xs text-brand-muted">kcal</span></div>
                        </div>
                        <div class="bg-brand-card border border-white/10 p-4 rounded-2xl">
                            <span class="text-xs text-brand-muted font-semibold">Pasos Diarios</span>
                            <div class="text-2xl font-black mt-1">6.240</div>
                        </div>
                        <div class="bg-brand-card border border-white/10 p-4 rounded-2xl">
                            <span class="text-xs text-brand-muted font-semibold">Tiempo Activo</span>
                            <div class="text-2xl font-black mt-1">48 <span class="text-xs text-brand-muted">min</span></div>
                        </div>
                        <div class="bg-brand-card border border-white/10 p-4 rounded-2xl">
                            <span class="text-xs text-brand-muted font-semibold">Agua</span>
                            <div class="text-2xl font-black mt-1">1.5 <span class="text-xs text-brand-muted">L</span></div>
                        </div>
                    </div>

                    {/* Navbar Flotante */}
                    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#121512]/90 backdrop-blur-md border border-white/15 px-4 py-2 rounded-full flex gap-3 shadow-2xl z-50">
                        <button class="bg-brand-neon text-black font-extrabold px-5 py-2 rounded-full text-xs">🏠 Inicio</button>
                        <button class="text-brand-muted hover:text-white font-bold px-4 py-2 text-xs">🏋️ Rutina</button>
                        <button class="text-brand-muted hover:text-white font-bold px-4 py-2 text-xs">👤 Perfil</button>
                    </div>
                </div>
            );
        }

        // 3. APLICACIÓN PRINCIPAL (CONTROLADOR DE PANTALLAS)
        function App() {
            const [screen, setScreen] = useState('landing');

            return (
                <div>
                    {screen === 'landing' && (
                        <LandingScreen onEnter={() => setScreen('dashboard')} />
                    )}
                    {screen === 'dashboard' && (
                        <DashboardScreen />
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
