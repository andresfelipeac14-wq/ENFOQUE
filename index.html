<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ENFOQUE - Fitness UI Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0c0e">
  
  <style>
    :root {
      --bg-main: #0b0c0e;
      --card-bg: #15181c;
      --card-inner: #1c2026;
      --accent-neon: #00e676;
      --accent-glow: rgba(0, 230, 118, 0.45);
      --text-main: #ffffff;
      --text-muted: #8e95a0;
      --fire: #ff6d00;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 110px; -webkit-tap-highlight-color: transparent; }

    /* Top Bar & Branding */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 10px;
    }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .brand-avatar {
      width: 45px; height: 45px;
      border-radius: 50%;
      border: 2px solid var(--accent-neon);
      object-fit: cover;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .brand-title { font-size: 1.1rem; font-weight: 900; letter-spacing: 0.5px; }
    .brand-sub { font-size: 0.75rem; color: var(--text-muted); }

    /* Main Featured Card (Hero con Atleta) */
    .featured-hero {
      position: relative;
      height: 220px;
      margin: 10px 20px 20px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .featured-hero img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.55);
      z-index: 1;
    }
    .hero-content { position: relative; z-index: 2; }
    .hero-tag {
      background: var(--accent-neon);
      color: #000;
      font-size: 0.68rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .hero-verse { font-size: 1.15rem; font-weight: 800; line-height: 1.3; }
    .hero-ref { font-size: 0.8rem; color: var(--accent-neon); font-weight: 700; margin-top: 4px; }

    /* Performance Bar Widget (Métricas Visuales) */
    .metrics-widget {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin: 0 20px 20px;
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .metric-info { display: flex; flex-direction: column; gap: 4px; }
    .metric-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .metric-val { font-size: 1.2rem; font-weight: 900; color: #fff; }

    .bars-container {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 45px;
    }
    .bar {
      width: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      transition: height 0.3s;
    }
    .bar.active { background: var(--accent-neon); box-shadow: 0 0 8px var(--accent-glow); }

    /* Categories Horizontal Scroll */
    .categories-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 20px 15px;
      scrollbar-width: none;
    }
    .cat-card {
      min-width: 130px;
      height: 100px;
      border-radius: var(--radius-md);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .cat-card img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
    .cat-title {
      position: absolute; bottom: 10px; left: 10px;
      font-size: 0.82rem; font-weight: 800; color: #fff;
      z-index: 2;
    }

    /* Day Selector Scroll (Pills) */
    .day-selector-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 20px 15px;
      scrollbar-width: none;
    }
    .day-pill {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.05);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .day-pill.active { background: var(--accent-neon); color: #000; box-shadow: 0 0 12px var(--accent-glow); }

    /* Exercise Items con Miniaturas de Atletas */
    .exercise-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin: 0 20px 15px;
      display: flex;
      gap: 14px;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .exercise-thumb {
      width: 75px; height: 75px;
      border-radius: var(--radius-md);
      object-fit: cover;
      flex-shrink: 0;
    }
    .exercise-info { flex: 1; }
    .exercise-name { font-size: 0.95rem; font-weight: 800; margin-bottom: 4px; }
    .exercise-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }

    .weight-input-container {
      background: var(--card-inner);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .weight-input-container label { font-size: 0.7rem; color: var(--accent-neon); font-weight: 800; }
    .weight-input-container input {
      background: none; border: none;
      color: #fff; font-size: 0.95rem; font-weight: 900;
      width: 65px; text-align: right; outline: none;
    }

    .fire-badge {
      display: none;
      background: rgba(255, 109, 0, 0.15);
      border: 1px solid var(--fire);
      color: var(--fire);
      font-weight: 800;
      font-size: 0.72rem;
      text-align: center;
      padding: 6px;
      border-radius: 8px;
      margin-top: 8px;
    }

    /* Floating Dock Navigation & Music Player */
    .bottom-dock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 420px;
      background: rgba(21, 24, 28, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 35px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 999;
    }
    .dock-btn {
      background: none; border: none;
      color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 0.68rem; font-weight: 800;
      padding: 8px 16px;
      border-radius: 25px;
      cursor: pointer;
    }
    .dock-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .dock-btn.active { background: var(--accent-neon); color: #000; box-shadow: 0 0 12px var(--accent-glow); }

    .music-float-btn {
      position: fixed;
      bottom: 85px; right: 20px;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--accent-neon);
      color: #000;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 15px var(--accent-glow);
      cursor: pointer;
      z-index: 998;
      border: none;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="user-profile">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Avatar" class="brand-avatar">
      <div>
        <div class="brand-title">ENFOQUE</div>
        <div class="brand-sub">Rendimiento Pro</div>
      </div>
    </div>
  </div>

  <!-- HERO FEATURED ATLETA -->
  <div class="featured-hero">
    <img src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=800&auto=format&fit=crop&q=80" alt="Atleta">
    <div class="hero-content">
      <span class="hero-tag">FILIPENSES 4:13</span>
      <div class="hero-verse">"Todo lo puedo en Cristo que me fortalece"</div>
      <div class="hero-ref">ENFOQUE FITNESS</div>
    </div>
  </div>

  <!-- METRICAS DE RENDIMIENTO (BARRAS) -->
  <div class="metrics-widget">
    <div class="metric-info">
      <div class="metric-title">Progreso Semanal</div>
      <div class="metric-val">88% Fuerza</div>
    </div>
    <div class="bars-container">
      <div class="bar" style="height: 30%;"></div>
      <div class="bar active" style="height: 70%;"></div>
      <div class="bar active" style="height: 90%;"></div>
      <div class="bar" style="height: 50%;"></div>
      <div class="bar active" style="height: 100%;"></div>
      <div class="bar active" style="height: 80%;"></div>
    </div>
  </div>

  <!-- CATEGORÍAS EN SCROLL -->
  <div class="categories-scroll">
    <div class="cat-card">
      <img src="https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=300&auto=format&fit=crop&q=80" alt="Fuerza">
      <div class="cat-title">Fuerza</div>
    </div>
    <div class="cat-card">
      <img src="https://images.unsplash.com/photo-1518611012118-696072aa579a?w=300&auto=format&fit=crop&q=80" alt="Cardio">
      <div class="cat-title">Cardio</div>
    </div>
    <div class="cat-card">
      <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=300&auto=format&fit=crop&q=80" alt="Yoga">
      <div class="cat-title">Movilidad</div>
    </div>
  </div>

  <!-- SELECTOR DE DÍAS -->
  <div class="day-selector-scroll">
    <button class="day-pill active" onclick="loadDay('lunes', this)">Lunes</button>
    <button class="day-pill" onclick="loadDay('martes', this)">Martes</button>
    <button class="day-pill" onclick="loadDay('miercoles', this)">Miércoles</button>
    <button class="day-pill" onclick="loadDay('jueves', this)">Jueves</button>
    <button class="day-pill" onclick="loadDay('viernes', this)">Viernes</button>
  </div>

  <!-- LISTA DE EJERCICIOS -->
  <div id="exerciseList"></div>

  <!-- BOTÓN DE MÚSICA MOTIVACIONAL -->
  <button class="music-float-btn" onclick="toggleAudio()">🎵</button>
  <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a834e3.mp3?filename=inspiring-cinematic-ambient-116199.mp3"></audio>

  <!-- BOTTOM FLOATING DOCK -->
  <div class="bottom-dock">
    <button class="dock-btn active">
      <svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 6.29 3.43 4.86 2 3.43 3.43 2 4.86 3.43 6.29 2 7.71 3.43 9.14 2 10.57 3.43 12 7 3.43 15.57 2 17 3.43 18.43 2 19.86 3.43 21.29 4.86 19.86 6.29 21.29 7.71 19.86 9.14 21.29 10.57 19.86 12 17 20.57 14.86z"/></svg>
      Entreno
    </button>
    <button class="dock-btn">
      <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.38L6.08 22pxh2.83l-.37-8.62C10.54 12.9 12 11.12 12 9V2h-1v7zm7-7s-3 0-3 5v6h2v9h2V2h-1z"/></svg>
      Nutrición
    </button>
  </div>

  <script>
    const routines = {
      lunes: [
        { name: "Press Inclinado Barra", prev: 60, img: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=200&auto=format&fit=crop&q=80" },
        { name: "Press Plano Mancuernas", prev: 24, img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200&auto=format&fit=crop&q=80" },
        { name: "Press Militar Hombro", prev: 18, img: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=200&auto=format&fit=crop&q=80" }
      ],
      martes: [
        { name: "Jalón al Pecho Polea", prev: 55, img: "https://images.unsplash.com/photo-1605296867304-46d5465a13f1?w=200&auto=format&fit=crop&q=80" },
        { name: "Curl Bíceps Barra Z", prev: 30, img: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=200&auto=format&fit=crop&q=80" }
      ],
      miercoles: [
        { name: "Sentadilla Libre", prev: 80, img: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=200&auto=format&fit=crop&q=80" },
        { name: "Prensa 45°", prev: 140, img: "https://images.unsplash.com/photo-1534367507873-d2d7e24c797f?w=200&auto=format&fit=crop&q=80" }
      ],
      jueves: [
        { name: "Press Plano Barra", prev: 65, img: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=200&auto=format&fit=crop&q=80" }
      ],
      viernes: [
        { name: "Remo en Gironda", prev: 45, img: "https://images.unsplash.com/photo-1526506118085-60ce8714f8c5?w=200&auto=format&fit=crop&q=80" }
      ]
    };

    let currentDay = 'lunes';

    function loadDay(day, btn) {
      currentDay = day;
      document.querySelectorAll('.day-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function render() {
      const list = routines[currentDay] || [];
      const container = document.getElementById('exerciseList');
      container.innerHTML = '';

      list.forEach((ex, idx) => {
        const item = document.createElement('div');
        item.className = 'exercise-card';
        item.innerHTML = `
          <img src="${ex.img}" alt="${ex.name}" class="exercise-thumb">
          <div class="exercise-info">
            <div class="exercise-name">${ex.name}</div>
            <div class="exercise-meta">Anterior: ${ex.prev} kg</div>
            <div class="weight-input-container">
              <label>PESO HOY</label>
              <input type="number" placeholder="${ex.prev}" oninput="checkWeight(this, ${ex.prev}, ${idx})">
            </div>
            <div id="fire-${idx}" class="fire-badge">🔥 ¡HAS AUMENTADO TU FUERZA!</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function checkWeight(input, prevVal, idx) {
      const val = parseFloat(input.value);
      const badge = document.getElementById(`fire-${idx}`);
      if (!isNaN(val) && val > prevVal) {
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    function toggleAudio() {
      const audio = document.getElementById('bgMusic');
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    window.onload = render;
  </script>
</body>
</html>
