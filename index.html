<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ENFOQUE - Fitness & Nutrición</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0d0d">
  
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #16181a;
      --accent: #00e676;
      --accent-glow: rgba(0, 230, 118, 0.35);
      --text: #ffffff;
      --text-dim: #a0a0a0;
      --border: #222629;
      --fire: #ff6d00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding-bottom: 80px; }

    /* Header Banner con Logo y Versículo */
    .header-banner {
      background: linear-gradient(180deg, rgba(0,230,118,0.08) 0%, rgba(22,24,26,1) 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 15px 15px;
      text-align: center;
    }
    .app-logo {
      max-width: 60px;
      height: auto;
      margin: 0 auto 8px;
      display: block;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }
    .verse-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    .verse-title {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 1px;
      display: block;
    }

    /* Pestañas de Navegación */
    .nav-tabs {
      display: flex;
      justify-content: space-around;
      background: #121315;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .tab-btn {
      flex: 1;
      padding: 14px 5px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .container { padding: 15px; max-width: 500px; margin: 0 auto; }
    .section-content { display: none; }
    .section-content.active { display: block; }

    /* Tarjetas de Ejercicios */
    .day-selector {
      width: 100%;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: bold;
      border-radius: 8px;
      margin-bottom: 15px;
      outline: none;
    }
    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .exercise-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .prev-mark { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 12px; }
    
    .weight-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .weight-input-group label { font-size: 0.8rem; color: var(--accent); font-weight: 600; }
    .weight-input {
      width: 100%;
      padding: 12px;
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      outline: none;
    }
    .weight-input:focus { border-color: var(--accent); }

    .strength-alert {
      display: none;
      margin-top: 10px;
      background: rgba(255, 109, 0, 0.12);
      border: 1px solid var(--fire);
      color: var(--fire);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      animation: pulse 1.5s infinite;
    }

    /* Módulo Nutrición */
    .goal-toggle {
      display: flex;
      background: #0d0d0d;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
    }
    .goal-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      color: var(--text-dim);
      font-weight: 700;
      font-size: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .goal-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .menu-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }
    .menu-day-header {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .meal-item { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
    .meal-item:last-child { border-bottom: none; margin-bottom: 0; }
    .meal-name { font-size: 0.9rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .meal-desc { font-size: 0.82rem; color: var(--text-dim); line-height: 1.3; }
    .meal-macro { font-size: 0.75rem; color: var(--accent); margin-top: 3px; font-weight: 600; }

    .total-banner {
      background: linear-gradient(135deg, rgba(0,230,118,0.15) 0%, rgba(22,24,26,1) 100%);
      border: 1px solid var(--accent);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      margin-top: 15px;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 109, 0, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(255, 109, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 109, 0, 0); }
    }
  </style>
</head>
<body>

  <!-- BANNER CON LOGO Y VERSÍCULO -->
  <div class="header-banner">
    <img src="logo.png" alt="Logo ENFOQUE" class="app-logo" onerror="this.style.display='none'">
    <p class="verse-text">"Todo lo puedo en Cristo que me fortalece"</p>
    <small class="verse-title">FILIPENSES 4:13</small>
  </div>

  <!-- NAVEGACIÓN -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('rutina')">🏋️ RUTINA</button>
    <button class="tab-btn" onclick="switchTab('nutricion')">🥗 NUTRICIÓN</button>
  </div>

  <div class="container">
    
    <!-- MÓDULO 1: RUTINAS -->
    <div id="sec-rutina" class="section-content active">
      <select id="daySelect" class="day-selector" onchange="loadRoutine()">
        <option value="lunes">Lunes - Pecho, Tríceps & Hombro</option>
        <option value="martes">Martes - Espalda & Bíceps</option>
        <option value="miercoles">Miércoles - Pierna Completa</option>
        <option value="jueves">Jueves - Pecho & Hombro</option>
        <option value="viernes">Viernes - Espalda & Brazos</option>
        <option value="sabado">Sábado - Pierna & Enfoque Glúteo</option>
      </select>

      <div id="exerciseContainer"></div>
    </div>

    <!-- MÓDULO 2: NUTRICIÓN INTELIGENTE -->
    <div id="sec-nutricion" class="section-content">
      <div class="goal-toggle">
        <button id="btn-hip" class="goal-btn active" onclick="setNutritionGoal('hipertrofia')">💪 GANAR MASA</button>
        <button id="btn-def" class="goal-btn" onclick="setNutritionGoal('definicion')">🔥 BAJAR GRASA</button>
      </div>

      <div class="menu-card">
        <div id="menuDayHeader" class="menu-day-header"></div>
        <div id="mealsContainer"></div>
      </div>

      <div id="totalMacrosBanner" class="total-banner"></div>
    </div>

  </div>

  <script>
    // BASE DE DATOS DE RUTINAS (Mantenemos la tuya intacta)
    const routines = {
      lunes: [
        { name: "Press de Banca Inclinado con Barra", prev: 60 },
        { name: "Press Plano con Mancuernas", prev: 24 },
        { name: "Aperturas en Polea (Cruce de Cables)", prev: 15 },
        { name: "Press Militar con Mancuernas", prev: 18 },
        { name: "Extensión de Tríceps en Polea", prev: 25 }
      ],
      martes: [
        { name: "Jalón al Pecho (Polea Alta)", prev: 55 },
        { name: "Remo con Barra", prev: 50 },
        { name: "Remo Unilateral con Mancuerna", prev: 22 },
        { name: "Curl de Bíceps con Barra Z", prev: 30 },
        { name: "Curl Martillo", prev: 14 }
      ],
      miercoles: [
        { name: "Sentadilla Libre con Barra", prev: 80 },
        { name: "Prensa 45°", prev: 140 },
        { name: "Extensión de Cuádriceps", prev: 45 },
        { name: "Curl Femoral Tumbado", prev: 35 },
        { name: "Elevación de Talones (Gemelos)", prev: 60 }
      ],
      jueves: [
        { name: "Press de Banca Plano con Barra", prev: 65 },
        { name: "Fondos en Paralelas / Máquina", prev: 0 },
        { name: "Elevaciones Laterales de Hombro", prev: 10 },
        { name: "Press Francés para Tríceps", prev: 20 }
      ],
      viernes: [
        { name: "Dominadas / Jalón Agarre Estrecho", prev: 50 },
        { name: "Remo en Gironda (Polea Baja)", prev: 45 },
        { name: "Curl de Bíceps en Banco Scott", prev: 25 },
        { name: "Curl Concentrado", prev: 12 }
      ],
      sabado: [
        { name: "Peso Muerto Rumano", prev: 70 },
        { name: "Hip Thrust para Glúteo", prev: 90 },
        { name: "Zancadas / Búlgaras", prev: 16 },
        { name: "Abductores en Máquina", prev: 50 }
      ]
    };

    // BASE DE DATOS DE MENÚS DIARIOS ROTATIVOS
    const nutritionData = {
      hipertrofia: {
        0: { day: "Domingo", meals: [
          { type: "Desayuno", name: "Omelette de 4 Huevos + Avena", desc: "4 huevos enteros + 1 taza de avena cocida con banano.", macro: "580 kcal | 36g Proteína" },
          { type: "Almuerzo", name: "Pechuga de Pollo + Arroz blanco", desc: "220g pechuga a la plancha + 1.5 tazas de arroz + ensalada.", macro: "700 kcal | 50g Proteína" },
          { type: "Cena", name: "Carne de Res Magra + Yuca", desc: "200g carne + 1 taza de yuca + ensalada de aguacate.", macro: "620 kcal | 44g Proteína" }
        ], total: "2,350 kcal | 155g Proteína" },
        1: { day: "Lunes", meals: [
          { type: "Desayuno", name: "Tostadas Integrales + Huevos + Crema de Maní", desc: "4 huevos revueltos + 2 tostadas integrales con crema de maní.", macro: "600 kcal | 35g Proteína" },
          { type: "Almuerzo", name: "Carne Molida Magra + Papa Cocida", desc: "220g carne molida + 2 papas medianas + vegetal verde.", macro: "720 kcal | 48g Proteína" },
          { type: "Cena", name: "Filete de Pescado + Arroz + Aguacate", desc: "220g tilapia/trucha + 1 taza de arroz.", macro: "590 kcal | 42g Proteína" }
        ], total: "2,380 kcal | 152g Proteína" },
        2: { day: "Martes", meals: [
          { type: "Desayuno", name: "Batido Proteico + Avena & Banano", desc: "2 scoops proteína / 4 huevos + 80g avena licuada.", macro: "560 kcal | 40g Proteína" },
          { type: "Almuerzo", name: "Pechuga Gratinada + Pasta Integral", desc: "200g pollo + 1.5 tazas pasta cocida + queso bajo en grasa.", macro: "740 kcal | 52g Proteína" },
          { type: "Cena", name: "Atún en Agua + Arepa de Maíz", desc: "2 latas de atún + 1 arepa mediana con queso blanco.", macro: "580 kcal | 45g Proteína" }
        ], total: "2,320 kcal | 157g Proteína" },
        3: { day: "Miércoles", meals: [
          { type: "Desayuno", name: "Huevos Pericos + Arepa + Fruta", desc: "4 huevos con tomate/cebolla + 1 arepa + 1 manzana.", macro: "570 kcal | 32g Proteína" },
          { type: "Almuerzo", name: "Lomo de Cerdo Magro + Plátano Maduro", desc: "220g lomo + plátano asado + ensalada.", macro: "710 kcal | 49g Proteína" },
          { type: "Cena", name: "Pollo Desmechado + Puré de Papa", desc: "200g pollo + puré de papa criolla.", macro: "610 kcal | 44g Proteína" }
        ], total: "2,340 kcal | 150g Proteína" },
        4: { day: "Jueves", meals: [
          { type: "Desayuno", name: "Panqueques de Avena & Huevo", desc: "1 taza avena + 3 huevos + licuado de fresa.", macro: "590 kcal | 34g Proteína" },
          { type: "Almuerzo", name: "Pechuga a la Criolla + Arroz & Frijol", desc: "200g pollo + arroz + porción de frijol.", macro: "760 kcal | 54g Proteína" },
          { type: "Cena", name: "Carne Asada + Ensalada Mixta", desc: "200g carne + aguacate y tomate.", macro: "570 kcal | 42g Proteína" }
        ], total: "2,360 kcal | 155g Proteína" },
        5: { day: "Viernes", meals: [
          { type: "Desayuno", name: "Omelette de Queso & Jamón Magro", desc: "4 huevos + 2 lonchas jamón pavo + tostadas.", macro: "580 kcal | 38g Proteína" },
          { type: "Almuerzo", name: "Churrasco Magro + Yuca o Papa", desc: "220g carne res + yuca al vapor.", macro: "730 kcal | 50g Proteína" },
          { type: "Cena", name: "Pescado al Horno + Arroz", desc: "220g pescado + 1 taza arroz.", macro: "580 kcal | 41g Proteína" }
        ], total: "2,310 kcal | 151g Proteína" },
        6: { day: "Sábado", meals: [
          { type: "Desayuno", name: "Bowl de Avena, Frutos Secos & Huevos", desc: "3 huevos cocidos + bowl de avena caliente.", macro: "600 kcal | 35g Proteína" },
          { type: "Almuerzo", name: "Pollo al Horno + Plátano + Ensalada", desc: "220g pollo + plátano asado.", macro: "720 kcal | 48g Proteína" },
          { type: "Cena", name: "Sandwich Doble de Pollo/Atún", desc: "Pan integral + 150g pollo o atún + queso.", macro: "600 kcal | 45g Proteína" }
        ], total: "2,370 kcal | 153g Proteína" }
      },
      definicion: {
        0: { day: "Domingo", meals: [
          { type: "Desayuno", name: "Omelette con Espinaca & 1 Tostada", desc: "4 claras + 1 huevo entero + espinaca + 1 tostada integral.", macro: "320 kcal | 28g Proteína" },
          { type: "Almuerzo", name: "Pechuga a la Plancha + Ensalada Grande", desc: "200g pechuga + 1/2 taza arroz blanco + abundante ensalada.", macro: "480 kcal | 46g Proteína" },
          { type: "Cena", name: "Filete de Tilapia + Pepino & Aguacate", desc: "200g pescado + ensalada verde con limón.", macro: "380 kcal | 40g Proteína" }
        ], total: "1,600 kcal | 144g Proteína" },
        1: { day: "Lunes", meals: [
          { type: "Desayuno", name: "Huevos Revueltos con Tomate & Té Verde", desc: "3 huevos revueltos + tomate + té verde sin azúcar.", macro: "340 kcal | 22g Proteína" },
          { type: "Almuerzo", name: "Carne Magra de Res + 1 Papa Cocida", desc: "180g carne + 1 papa mediana + brócoli al vapor.", macro: "500 kcal | 44g Proteína" },
          { type: "Cena", name: "Lata de Atún + Ensalada Mixta", desc: "2 latas de atún en agua + aguacate y tomate.", macro: "360 kcal | 42g Proteína" }
        ], total: "1,620 kcal | 140g Proteína" },
        2: { day: "Martes", meals: [
          { type: "Desayuno", name: "Batido Proteico en Agua & Fresa", desc: "1.5 scoops proteína / 4 claras + fresas naturales.", macro: "290 kcal | 32g Proteína" },
          { type: "Almuerzo", name: "Pollo Desmechado + 1/2 Taza de Frijol", desc: "200g pechuga + frijol + ensalada de repollo.", macro: "510 kcal | 48g Proteína" },
          { type: "Cena", name: "Omelette Nocturno de Claras", desc: "5 claras + champiñones.", macro: "320 kcal | 30g Proteína" }
        ], total: "1,580 kcal | 142g Proteína" },
        3: { day: "Miércoles", meals: [
          { type: "Desayuno", name: "Huevos Cocidos + 1/2 Banano", desc: "3 huevos cocidos + 1/2 banano.", macro: "330 kcal | 21g Proteína" },
          { type: "Almuerzo", name: "Lomo de Cerdo + Ensalada Verde", desc: "180g lomo magro + aguacate + verduras.", macro: "490 kcal | 42g Proteína" },
          { type: "Cena", name: "Pechuga a la Plancha + Calabacín", desc: "180g pechuga + calabacín asado.", macro: "370 kcal | 41g Proteína" }
        ], total: "1,610 kcal | 138g Proteína" },
        4: { day: "Jueves", meals: [
          { type: "Desayuno", name: "Arepa Pequeña + Queso Cuajada", desc: "1 arepa delgada + 80g queso bajo en grasa + café negro.", macro: "350 kcal | 20g Proteína" },
          { type: "Almuerzo", name: "Pescado al Vapor + 1/2 Taza Arroz", desc: "200g pescado + arroz + ensalada verde.", macro: "470 kcal | 43g Proteína" },
          { type: "Cena", name: "Carne Molida Magra + Guacamole", desc: "180g carne molida + ensalada con guacamole.", macro: "400 kcal | 40g Proteína" }
        ], total: "1,630 kcal | 143g Proteína" },
        5: { day: "Viernes", meals: [
          { type: "Desayuno", name: "Omelette de Jamón de Pavo", desc: "3 huevos + 2 lonchas pavo + té verde.", macro: "330 kcal | 26g Proteína" },
          { type: "Almuerzo", name: "Pechuga a la Parriilla + Yuca Cocida", desc: "200g pollo + 1 trozo pequeño de yuca.", macro: "500 kcal | 46g Proteína" },
          { type: "Cena", name: "Atún con Picadillo de Pepino", desc: "2 latas de atún + pepino + limón.", macro: "340 kcal | 41g Proteína" }
        ], total: "1,590 kcal | 145g Proteína" },
        6: { day: "Sábado", meals: [
          { type: "Desayuno", name: "Huevos Revueltos + 1 Tostada Integral", desc: "3 huevos + 1 tostada.", macro: "340 kcal | 22g Proteína" },
          { type: "Almuerzo", name: "Pollo al Horno + Ensalada Rusa Ligera", desc: "200g pollo + ensalada.", macro: "510 kcal | 45g Proteína" },
          { type: "Cena", name: "Consomé con Pollo Desmechado", desc: "Caldo magro + 150g pechuga desmechada.", macro: "350 kcal | 38g Proteína" }
        ], total: "1,620 kcal | 141g Proteína" }
      }
    };

    let currentNutritionGoal = 'hipertrofia';

    // CAMBIO DE PESTAÑAS
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
      
      if(tab === 'rutina') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('sec-rutina').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('sec-nutricion').classList.add('active');
        loadNutrition();
      }
    }

    // CARGAR RUTINA DEL DÍA SELECCIONADO
    function loadRoutine() {
      const day = document.getElementById('daySelect').value;
      const list = routines[day] || [];
      const container = document.getElementById('exerciseContainer');
      container.innerHTML = '';

      list.forEach((ex, index) => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        card.innerHTML = `
          <div class="exercise-title">${ex.name}</div>
          <div class="prev-mark">Última marca registrada: <strong>${ex.prev} kg</strong></div>
          <div class="weight-input-group">
            <label>Peso de Hoy (kg):</label>
            <input type="number" class="weight-input" id="weight-${index}" placeholder="${ex.prev}" oninput="checkStrength(${index}, ${ex.prev})">
          </div>
          <div id="alert-${index}" class="strength-alert">
            🔥 ¡HAS AUMENTADO TU FUERZA! Subiendo de nivel.
          </div>
        `;
        container.appendChild(card);
      });
    }

    // COMPROBAR SI AUMENTÓ LA FUERZA
    function checkStrength(index, prevWeight) {
      const inputVal = parseFloat(document.getElementById(`weight-${index}`).value);
      const alertBox = document.getElementById(`alert-${index}`);
      
      if(!isNaN(inputVal) && inputVal > prevWeight) {
        alertBox.style.display = 'block';
      } else {
        alertBox.style.display = 'none';
      }
    }

    // CONFIGURAR OBJETIVO DE NUTRICIÓN
    function setNutritionGoal(goal) {
      currentNutritionGoal = goal;
      document.getElementById('btn-hip').classList.toggle('active', goal === 'hipertrofia');
      document.getElementById('btn-def').classList.toggle('active', goal === 'definicion');
      loadNutrition();
    }

    // CARGAR MENÚ ROTATIVO SEGÚN DÍA DE LA SEMANA
    function loadNutrition() {
      const todayIndex = new Date().getDay(); // 0 = Domingo, 1 = Lunes...
      const data = nutritionData[currentNutritionGoal][todayIndex];

      document.getElementById('menuDayHeader').innerText = `📅 MENÚ DE HOY: ${data.day}`;
      
      const container = document.getElementById('mealsContainer');
      container.innerHTML = '';

      data.meals.forEach(m => {
        const item = document.createElement('div');
        item.className = 'meal-item';
        item.innerHTML = `
          <div class="meal-name">${m.type}: ${m.name}</div>
          <div class="meal-desc">${m.desc}</div>
          <div class="meal-macro">${m.macro}</div>
        `;
        container.appendChild(item);
      });

      document.getElementById('totalMacrosBanner').innerHTML = `
        <div style="font-size:0.78rem; color:var(--text-dim);">TOTAL RECOMENDADO DIARIO</div>
        <div style="font-size:1.1rem; font-weight:bold; color:var(--accent); margin-top:2px;">${data.total}</div>
      `;
    }

    // AUTO-ACTUALIZACIÓN AUTOMÁTICA DEL SERVICE WORKER EN EL CELULAR
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              window.location.reload();
            }
          });
        });
      });
    }

    // INICIALIZACIÓN
    window.onload = () => {
      loadRoutine();
    };
  </script>
</body>
</html>
