<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ENFOQUE — Personal Fitness Coach</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#07130D">
</head>
<body>

    <!-- ================= 1. PORTADA ================= -->
    <section id="screen-landing" class="screen active">
        <div class="landing-hero">
            <div class="verse-header">1 Corintios 9:27</div>
            <h1 class="landing-title">DISCIPLINA</h1>
            <div class="landing-logo-container">
                <img src="ENFOQUE.jpg" alt="Logo ENFOQUE" class="landing-logo">
            </div>
            <button class="btn-primary-neon btn-glow" onclick="App.startOnboarding()">ENTRAR</button>
            <div class="verse-footer">JOSUÉ 1:9</div>
        </div>
    </section>

    <!-- ================= 2. ONBOARDING ================= -->
    <section id="screen-onboarding" class="screen">
        <div class="onboarding-container card-glass">
            <div class="step-indicator">Paso <span id="onboarding-step-num">1</span> de 4</div>
            
            <!-- Step 1: Objetivo -->
            <div id="ob-step-1" class="ob-step active">
                <h2>¿CUÁL ES TU OBJETIVO PRINCIPAL?</h2>
                <div class="goal-selector">
                    <button class="card-option" onclick="App.selectGoal('gain')">
                        <span class="icon">💪</span>
                        <h3>GANAR MASA MUSCULAR</h3>
                        <p>Hipertrofia, aumento de volumen muscular y fuerza progresiva.</p>
                    </button>
                    <button class="card-option" onclick="App.selectGoal('lose')">
                        <span class="icon">🔥</span>
                        <h3>PERDER GRASA</h3>
                        <p>Déficit controlado, preservación de masa muscular y definición.</p>
                    </button>
                </div>
            </div>

            <!-- Step 2: Datos Personales -->
            <div id="ob-step-2" class="ob-step">
                <h2>CUÉNTANOS SOBRE TI</h2>
                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" id="ob-name" class="input-dark" placeholder="Ej: Andrés Felipe">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" id="ob-age" class="input-dark" placeholder="44">
                    </div>
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" id="ob-city" class="input-dark" placeholder="Medellín">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Peso (kg)</label>
                        <input type="number" id="ob-weight" class="input-dark" placeholder="85">
                    </div>
                    <div class="form-group">
                        <label>Estatura (cm)</label>
                        <input type="number" id="ob-height" class="input-dark" placeholder="178">
                    </div>
                </div>
                <button class="btn-primary-neon" onclick="App.nextOnboardingStep(3)">CONTINUAR</button>
            </div>

            <!-- Step 3: Nivel -->
            <div id="ob-step-3" class="ob-step">
                <h2>¿CUÁL ES TU NIVEL DE ENTRENAMIENTO?</h2>
                <div class="level-selector">
                    <button class="card-option" onclick="App.selectLevel('beginner')">
                        <h3>PRINCIPIANTE</h3>
                        <p>Menos de 6 meses de entrenamiento constante.</p>
                    </button>
                    <button class="card-option" onclick="App.selectLevel('intermediate')">
                        <h3>INTERMEDIO</h3>
                        <p>6 meses a 2 años dominando técnica y cargas.</p>
                    </button>
                    <button class="card-option" onclick="App.selectLevel('advanced')">
                        <h3>AVANZADO</h3>
                        <p>Más de 2 años con programación estructurada.</p>
                    </button>
                </div>
            </div>

            <!-- Step 4: Confirmación -->
            <div id="ob-step-4" class="ob-step">
                <h2>¡TU PLAN ENFOQUE ESTÁ LISTO!</h2>
                <div class="summary-card" id="ob-summary"></div>
                <button class="btn-primary-neon btn-glow" onclick="App.finishOnboarding()">COMENZAR MI PLAN 🔥</button>
            </div>
        </div>
    </section>

    <!-- ================= 3. MAIN APP LAYOUT ================= -->
    <div id="screen-main-app" class="screen">
        <header class="app-header">
            <div class="header-logo">
                <img src="ENFOQUE.jpg" alt="Logo ENFOQUE">
            </div>
            <div class="header-user-info">
                <span id="header-user-name">Hola, Atleta</span>
                <span id="header-user-badge" class="badge-neon">SEMANA 1</span>
            </div>
        </header>

        <main class="app-content">
            <section id="tab-dashboard" class="tab-page active">
                <div class="card-glass">
                    <h2 id="dash-greeting">¡Bienvenido a ENFOQUE!</h2>
                    <p class="text-muted" style="margin-top: 6px;">Tu plan personalizado ya está activo.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- MOTOR LÓGICO INTEGRADO DIRECTAMENTE -->
    <script>
        const Storage = {
            KEYS: { USER: 'enfoque_user_profile' },
            saveUser(profile) { localStorage.setItem(this.KEYS.USER, JSON.stringify(profile)); },
            getUser() { const d = localStorage.getItem(this.KEYS.USER); return d ? JSON.parse(d) : null; }
        };

        const App = {
            user: null,
            tempUser: {},

            init() {
                this.user = Storage.getUser();
                if (!this.user) {
                    this.showScreen('screen-landing');
                } else {
                    this.showScreen('screen-main-app');
                    this.renderDashboard();
                }
            },

            showScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                const target = document.getElementById(id);
                if (target) target.classList.add('active');
            },

            startOnboarding() {
                this.showScreen('screen-onboarding');
                this.showObStep(1);
            },

            showObStep(step) {
                document.querySelectorAll('.ob-step').forEach(s => s.classList.remove('active'));
                const currentStep = document.getElementById(`ob-step-${step}`);
                if (currentStep) currentStep.classList.add('active');
                const stepNum = document.getElementById('onboarding-step-num');
                if (stepNum) stepNum.innerText = step;
            },

            selectGoal(goal) {
                this.tempUser.goal = goal;
                this.showObStep(2);
            },

            nextOnboardingStep(step) {
                if (step === 3) {
                    this.tempUser.name = document.getElementById('ob-name').value || "Andrés";
                    this.tempUser.age = document.getElementById('ob-age').value || 44;
                    this.tempUser.city = document.getElementById('ob-city').value || "Medellín";
                    this.tempUser.weight = parseFloat(document.getElementById('ob-weight').value) || 85;
                    this.tempUser.height = parseFloat(document.getElementById('ob-height').value) || 178;
                    this.showObStep(3);
                }
            },

            selectLevel(level) {
                this.tempUser.level = level;
                this.tempUser.currentWeek = 1;
                
                const summary = document.getElementById('ob-summary');
                if (summary) {
                    summary.innerHTML = `
                        <p style="margin-top:10px;"><strong>Atleta:</strong> ${this.tempUser.name}</p>
                        <p><strong>Objetivo:</strong> ${this.tempUser.goal === 'gain' ? 'Ganar Masa Muscular' : 'Perder Grasa'}</p>
                        <p><strong>Peso Inicial:</strong> ${this.tempUser.weight} kg</p>
                    `;
                }
                this.showObStep(4);
            },

            finishOnboarding() {
                this.user = { ...this.tempUser };
                Storage.saveUser(this.user);
                this.showScreen('screen-main-app');
                this.renderDashboard();
            },

            renderDashboard() {
                const userName = document.getElementById('header-user-name');
                if (userName) userName.innerText = `Hola, ${this.user.name} 👋`;
                
                const greeting = document.getElementById('dash-greeting');
                if (greeting) greeting.innerText = `¡Hola ${this.user.name}, listo para entrenar!`;
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
